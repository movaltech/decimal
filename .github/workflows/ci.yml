name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (race detector, coverage)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Enforce 100% statement coverage
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total statement coverage: ${total}%"
          below=$(awk -v t="$total" 'BEGIN { print (t < 100) ? "1" : "0" }')
          if [ "$below" = "1" ]; then
            echo "Coverage dropped below 100% (got ${total}%) — this package's correctness claims rest on full statement coverage, so a drop must be treated as a build failure, not a warning."
            exit 1
          fi

      - name: Benchmarks (compile-check only)
        run: go test -run=^$ -bench=. -benchtime=1x ./...

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [FuzzParse, FuzzRescale, FuzzQuoScale, FuzzPow, FuzzMoney]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Fuzz ${{ matrix.target }} (short smoke run)
        run: go test -fuzz=^${{ matrix.target }}$ -fuzztime=30s .
